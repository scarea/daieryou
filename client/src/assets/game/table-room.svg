<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="2.5D card room background">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="48%" stop-color="#0f766e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#071923"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123447"/>
      <stop offset="0.52" stop-color="#102b38"/>
